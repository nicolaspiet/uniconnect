name: Publish Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Require persistent signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. No release was published."
              exit 1
            fi
          done
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Sign and create update metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/uniconnect-release.jks"
          apk="dist/uniconnect-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/uniconnect-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/uniconnect-certificate.txt"
          actual_signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/uniconnect-certificate.txt")
          if [[ -z "$ANDROID_SIGNER_SHA256" || "$actual_signer" != "$ANDROID_SIGNER_SHA256" ]]; then
            echo "::error::Signing certificate differs from the installed distribution. No release was published."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          python3 tools/release_metadata.py "$apk" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --tag "$GITHUB_REF_NAME" --output dist/uniconnect-update.json
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 dist/uniconnect-update.json --verify-tag --generate-notes --title "UniConnect ${GITHUB_REF_NAME#v}"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/uniconnect-release.jks"
